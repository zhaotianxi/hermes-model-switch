name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Compile
        run: |
          python -m py_compile scripts/hermes_switch_model.py tools/model-diagnosis.py src/hermes_model_switch/*.py tests/*.py
      - name: Run tests
        run: pytest
